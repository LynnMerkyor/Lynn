name: Local Model Runtime
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/release-*']
    paths:
      - build/dflash-llamacpp-runtime.json
      - desktop/llamacpp-runtime-installer.cjs
      - scripts/check-dflash-runtime-contract.mjs
      - .github/workflows/local-model-runtime.yml
jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned runtime and native DFlash2 command contract
        run: node scripts/check-dflash-runtime-contract.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dflash-runtime-${{ runner.os }}-${{ runner.arch }}
          path: output/local-model-runtime/
          if-no-files-found: error
