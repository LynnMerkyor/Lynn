<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f2ec"><meta name="apple-mobile-web-app-capable" content="yes"><title>Lynn</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body><header><a href="/" class="brand">Lynn<span>随时接着聊</span></a><button id="install" hidden>安装</button></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="pairing" class="pairing"><h1>在手机上继续</h1><p>在电脑的 Lynn → 设置 → 界面 → 手机访问中，生成配对二维码并扫描。</p><form id="pair-form"><label for="device-name">设备名称</label><input id="device-name" autocomplete="off" maxlength="80" placeholder="我的手机"><button type="submit">连接这台设备</button></form></section>
<main id="workspace" hidden><aside><label for="sessions">会话</label><select id="sessions"></select><button id="refresh" type="button">刷新</button><p id="connection-note">手机与电脑使用同一段对话。</p></aside>
<section class="conversation"><div class="conversation-heading"><h1 id="title">Lynn</h1><button id="older" hidden>更早的消息</button></div><div id="messages" aria-label="会话消息"></div><p id="busy" role="status" hidden>正在处理…需要工具授权时，请在电脑上确认。</p><details id="files"><summary>会话文件</summary><ul id="file-list"></ul></details>
<form id="composer"><label class="sr-only" for="message">消息</label><textarea id="message" rows="3" maxlength="50000" placeholder="继续这段对话…" required></textarea><div id="attachments"></div><div class="composer-actions"><label class="file-button" for="upload">添加文件<input id="upload" type="file" hidden></label><span id="upload-note">最多 10 MB</span><button id="stop" type="button" hidden>停止</button><button id="send" type="submit">发送</button></div></form></section></main>
<footer>连接到你自己的 Lynn</footer></body></html>
